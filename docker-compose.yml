services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookslib
      POSTGRES_USER: bookslib
      POSTGRES_PASSWORD: bookslib_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookslib -d bookslib"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Catalog: Host=postgres;Port=5432;Database=bookslib;Username=bookslib;Password=bookslib_dev
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:5080
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
