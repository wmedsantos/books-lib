services:
  - type: web
    name: bookslib-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: bookslib-db
          property: connectionString
      - key: Cors__AllowedOrigins__0
        value: https://biblio.ubemtem.org
      - key: Jwt__SigningKey
        generateValue: true
      - key: Bootstrap__Email
        sync: false
      - key: Bootstrap__Password
        sync: false

databases:
  - name: bookslib-db
    databaseName: bookslib
    user: bookslib
    plan: free
